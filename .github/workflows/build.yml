name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  # "Start-Knopf": Actions -> Build -> Run workflow. Re-targets the plugins to a new ARVIO release:
  # derives ARVIO's rename table from that release's APK, bumps every plugin version (so ARVIO
  # re-downloads them), checks the result against the APK and only then publishes.
  workflow_dispatch:
    inputs:
      arvio_version:
        description: "ARVIO-Version (z. B. v2.0.1) - leer lassen = neueste Version"
        required: false
        default: ""
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - 'repo.json'

# The workflow needs to push the compiled .cs3 + plugins.json to the builds branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
          persist-credentials: true

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 17

      # No setup-android step: GitHub's ubuntu runners ship an Android SDK ($ANDROID_HOME), and
      # android-actions/setup-android (v2 and v3) crashes on the current runners (09/2026).
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Get ARVIO APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd $GITHUB_WORKSPACE/src
          WANT="${{ github.event.inputs.arvio_version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$WANT" ]; then
            WANT=$(gh release view --repo ProdigyV21/ARVIO --json tagName -q .tagName)
          fi
          [ -z "$WANT" ] && WANT=$(cat scripts/arvio-version.txt)
          echo "ARVIO version: $WANT"
          echo "ARVIO_VERSION=$WANT" >> $GITHUB_ENV
          gh release download "$WANT" --repo ProdigyV21/ARVIO -p '*sideload-release.apk' -O $RUNNER_TEMP/arvio.apk
          ls -la $RUNNER_TEMP/arvio.apk

      - name: Re-target plugins to this ARVIO version (Start-Knopf only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd $GITHUB_WORKSPACE/src
          curl -sSfL -o $RUNNER_TEMP/lib.aar https://jitpack.io/com/github/recloudstream/cloudstream/library-android/v4.7.0/library-android-v4.7.0.aar
          unzip -o -q $RUNNER_TEMP/lib.aar classes.jar -d $RUNNER_TEMP/lib
          curl -sSfL -o $RUNNER_TEMP/stdlib.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.3.0/kotlin-stdlib-2.3.0.jar
          python3 scripts/find_arvio_names.py $RUNNER_TEMP/arvio.apk $RUNNER_TEMP/lib/classes.jar $RUNNER_TEMP/stdlib.jar $RUNNER_TEMP/names.txt
          { echo "# ARVIO rename table - generated by scripts/find_arvio_names.py"; echo "# for: ARVIO-$ARVIO_VERSION-sideload-release.apk (github.com/ProdigyV21/ARVIO releases)"; cat $RUNNER_TEMP/names.txt; } > scripts/arvio-names.txt
          echo "$ARVIO_VERSION" > scripts/arvio-version.txt
          # bump every plugin version, otherwise ARVIO keeps the old .cs3
          for f in */build.gradle.kts; do
            v=$(sed -n 's/^version = \([0-9]*\)$/\1/p' $f); [ -n "$v" ] && sed -i "s/^version = $v$/version = $((v+1))/" $f
          done
          git diff --stat

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp -f */build/*.cs3 $GITHUB_WORKSPACE/builds 2>/dev/null || true
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Check plugins against the ARVIO APK (nothing is published if this fails)
        run: |
          cd $GITHUB_WORKSPACE/src
          python3 scripts/check_against_arvio.py $RUNNER_TEMP/arvio.apk */build/*.cs3

      - name: Save new rename table + versions to main (Start-Knopf only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd $GITHUB_WORKSPACE/src
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add scripts/arvio-names.txt scripts/arvio-version.txt */build.gradle.kts
          git commit -m "Plugins auf ARVIO $ARVIO_VERSION umgestellt [skip ci]" || exit 0
          git push

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
