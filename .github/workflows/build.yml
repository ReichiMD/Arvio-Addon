name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - 'repo.json'

# The workflow needs to push the compiled .cs3 + plugins.json to the builds branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
          persist-credentials: true

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract ARVIO obfuscated cloudstream3 JAR
        run: |
          # Download ARVIO sideload APK and extract obfuscated cloudstream3 classes.
          # ARVIO's R8 renames kotlin.coroutines.Continuation→j7.d and kotlin.jvm.functions.Function1→x7.l.
          # We compile against these obfuscated types so suspend-method override descriptors match.
          cd $GITHUB_WORKSPACE/src
          mkdir -p libs
          pip install androguard
          # Download ARVIO APK
          curl -L -o /tmp/arvio.apk \
            "https://github.com/ProdigyV21/ARVIO/releases/download/v1.9.983/ARVIO-v1.9.983-sideload-release.apk"
          # Extract and combine all DEX files into a trimmed JAR
          python3 -c "
          import zipfile, os, subprocess, tempfile, shutil
          # Extract all classes*.dex from APK
          with zipfile.ZipFile('/tmp/arvio.apk') as z:
              dex_names = sorted([n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')])
              for d in dex_names:
                  z.extract(d, '/tmp/arvio_dex')
          # Convert each DEX to JAR using dex2jar
          os.makedirs('/tmp/dex2jar', exist_ok=True)
          d2j_url = 'https://github.com/ThexXTHEEXx/dex-tools/releases/download/v2.4/dex-tools-v2.4.zip'
          subprocess.run(['bash', '-c', f'curl -L -o /tmp/d2j.zip \"{d2j_url}\" && cd /tmp && unzip -o d2j.zip -d dex-tools'], check=True)
          jars = []
          for d in dex_names:
              dpath = f'/tmp/arvio_dex/{d}'
              jpath = f'/tmp/arvio_dex/{d.replace(\".dex\", \".jar\")}'
              subprocess.run(['bash', '/tmp/dex-tools/dex-tools-v2.4/d2j-dex2jar.sh', dpath, '-o', jpath, '--force'], check=True)
              jars.append(jpath)
          # Combine: keep cloudstream3 + obfuscated packages
          seen = set()
          with zipfile.ZipFile('libs/arvio-cloudstream3-v1.9.983.jar', 'w', zipfile.ZIP_DEFLATED) as out:
              for jar in jars:
                  with zipfile.ZipFile(jar) as z:
                      for name in z.namelist():
                          if name not in seen and name.endswith('.class'):
                              if name.startswith('com/lagradost/cloudstream3/') or not name.startswith(('com/', 'org/', 'java/', 'android/', 'androidx/', 'kotlin', 'sun/', 'javax/')):
                                  seen.add(name)
                                  out.writestr(name, z.read(name))
          print(f'Created arvio-cloudstream3-v1.9.983.jar with {len(seen)} classes')
          "

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp -f */build/*.cs3 $GITHUB_WORKSPACE/builds 2>/dev/null || true
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
