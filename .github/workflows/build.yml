name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - 'repo.json'

# The workflow needs to push the compiled .cs3 + plugins.json to the builds branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
          persist-credentials: true

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract ARVIO obfuscated cloudstream3 JAR
        run: |
          cd $GITHUB_WORKSPACE/src
          mkdir -p libs
          pip install androguard
          # Download ARVIO sideload APK
          curl -L -o /tmp/arvio.apk \
            "https://github.com/ProdigyV21/ARVIO/releases/download/v1.9.983/ARVIO-v1.9.983-sideload-release.apk"
          # Download dex2jar
          curl -L -o /tmp/d2j.zip \
            "https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip"
          cd /tmp && unzip -o d2j.zip -d dex-tools
          chmod +x /tmp/dex-tools/dex-tools-v2.4/d2j-dex2jar.sh
          # Extract all DEX files from APK and convert to JARs
          cd $GITHUB_WORKSPACE/src
          python3 scripts/extract_arvio_jar.py /tmp/arvio.apk /tmp/dex-tools/dex-tools-v2.4/d2j-dex2jar.sh libs/arvio-cloudstream3-v1.9.983.jar

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp -f */build/*.cs3 $GITHUB_WORKSPACE/builds 2>/dev/null || true
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
